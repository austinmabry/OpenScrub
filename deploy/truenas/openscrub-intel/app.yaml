description: >-
  OpenScrub is a local video-redaction tool — Intel GPU build. It detects
  and blurs faces, whole people (silhouette body masking), license plates,
  and on-screen PII (names, SSNs, addresses, card numbers, custom regex) in
  videos and screen recordings, with a human review step before anything is
  trusted. Quick Sync hardware encoding and OpenVINO-accelerated detection
  on any Intel iGPU (Gen 9+) or Arc card — allocate the GPU in the
  Resources section of the install form; the image ships Intel's media
  driver, so the host needs no extra driver install. Everything runs on
  this server — no footage leaves your network.
