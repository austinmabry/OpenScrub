# Builds the native Windows installer on every published release and
# attaches OpenScrub-Setup-<version>.exe to that release automatically,
# plus a version-less OpenScrub-Setup.exe copy so the permanent URL
# .../releases/latest/download/OpenScrub-Setup.exe always serves the
# newest installer (used by the website's Download button).
#
# Runs the exact same build a developer would run locally
# (windows\build_installer.bat -> PyInstaller + Inno Setup), so the
# release asset and a hand-built installer are interchangeable.

name: Windows installer

on:
  release:
    types: [published]
  # Manual fallback: build any existing release tag and attach the exe to it
  # (used when a release predates this workflow, or to rebuild an asset).
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (e.g. v1.0.7)"
        required: true

jobs:
  build-installer:
    name: Build and attach setup exe
    runs-on: windows-latest
    permissions:
      contents: write        # needed to upload the release asset
    steps:
      - uses: actions/checkout@v7
        with:
          # release event: the tag's commit; manual dispatch: the given tag
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install OpenScrub and its dependencies
        run: python -m pip install .

      - name: Ensure Inno Setup is present
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build exes and installer
        shell: cmd
        run: windows\build_installer.bat

      - name: Verify the installer was produced
        shell: pwsh
        run: |
          $exe = Get-ChildItem windows/output/OpenScrub-Setup-*.exe -ErrorAction SilentlyContinue
          if (-not $exe) { Write-Error "installer exe not found — build failed"; exit 1 }
          Write-Host "built: $($exe.FullName) ($([math]::Round($exe.Length/1MB)) MB)"

      - name: Attach installer to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = (Get-ChildItem windows/output/OpenScrub-Setup-*.exe).FullName
          # Also publish a version-LESS copy so a PERMANENT download URL
          # always resolves to the newest build (the website's Download
          # button points here):
          #   https://github.com/<owner>/<repo>/releases/latest/download/OpenScrub-Setup.exe
          $stable = Join-Path (Split-Path $exe) "OpenScrub-Setup.exe"
          Copy-Item $exe $stable -Force
          $tag = "${{ github.event.inputs.tag || github.event.release.tag_name }}"
          # uploads.github.com throws transient 5xx ("Error creating policy",
          # HTTP 502 — it failed a release once); --clobber makes retries safe
          $ok = $false
          foreach ($i in 1..6) {
            gh release upload "$tag" "$exe" "$stable" --clobber
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "upload attempt $i failed (exit $LASTEXITCODE) - retrying in 20s"
            Start-Sleep -Seconds 20
          }
          if (-not $ok) { Write-Error "release upload failed after 6 attempts"; exit 1 }
